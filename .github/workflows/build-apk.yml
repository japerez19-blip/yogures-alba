name: Build APK - Yogures Alba

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK Environment
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH

      - name: Accept Android SDK Licenses & Install Components
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" "platforms;android-34" "platform-tools"

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Configure Bubblewrap
        run: |
          mkdir -p ~/.bubblewrap
          cat <<EOF > ~/.bubblewrap/config.json
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "/usr/local/lib/android/sdk"
          }
          EOF

      - name: Generate Signing Keystore
        run: |
          keytool -genkeypair \
            -alias yogures-alba \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -keystore android.keystore \
            -storepass yogures123456 \
            -keypass yogures123456 \
            -dname "CN=Yogures Alba, OU=Dev, O=YoguresAlba, L=Caracas, ST=Miranda, C=VE"
          
          echo "=== SHA-256 Fingerprint ==="
          keytool -list -v -keystore android.keystore -alias yogures-alba -storepass yogures123456 | grep "SHA256:"

      - name: Update Android Project from twa-manifest.json
        run: |
          # Generate Android project structure from twa-manifest
          bubblewrap update --skipVersionUpgrade

      - name: Compile APK
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: yogures123456
          BUBBLEWRAP_KEY_PASSWORD: yogures123456
        run: |
          # First attempt with bubblewrap build
          bubblewrap build --skipPwaValidation || {
            echo "Bubblewrap build failed, attempting direct Gradle build..."
            chmod +x gradlew
            ./gradlew assembleRelease
          }

      - name: Verify and Package APK
        run: |
          echo "=== Listing generated APKs ==="
          find . -name "*.apk" -type f
          
          APK_FILE=$(find . -name "*signed*.apk" -o -name "*release*.apk" -o -name "*.apk" | head -1)
          
          if [ -z "$APK_FILE" ]; then
            echo "::error::No APK file found in build output!"
            exit 1
          fi
          
          echo "Found APK: $APK_FILE"
          cp "$APK_FILE" yogures-alba.apk
          ls -lh yogures-alba.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: yogures-alba-apk
          path: yogures-alba.apk
          retention-days: 90

      - name: Upload Build Artifacts (Logs & Project)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            twa-manifest.json
            android.keystore
          retention-days: 7
