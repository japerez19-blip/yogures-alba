name: Build APK - Yogures Alba

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK Environment
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH

      - name: Accept Android SDK Licenses & Install Build Tools
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" "platforms;android-34" || true

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Create Bubblewrap Config File (Non-Interactive)
        run: |
          mkdir -p ~/.bubblewrap
          cat <<EOF > ~/.bubblewrap/config.json
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "/usr/local/lib/android/sdk"
          }
          EOF
          cat ~/.bubblewrap/config.json

      - name: Generate signing keystore
        run: |
          keytool -genkeypair \
            -alias yogures-alba \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -keystore android.keystore \
            -storepass yogures123456 \
            -keypass yogures123456 \
            -dname "CN=Yogures Alba, OU=Dev, O=YoguresAlba, L=Caracas, ST=Miranda, C=VE"
          
          # Print SHA-256 fingerprint
          echo "=== SHA-256 Certificate Fingerprint ==="
          keytool -list -v -keystore android.keystore -alias yogures-alba -storepass yogures123456 | grep "SHA256:" || true

      - name: Prepare twa-manifest.json
        run: |
          python3 -c "
          import json
          with open('twa-manifest.json', 'r') as f:
              data = json.load(f)
          data['signingKey'] = {
              'path': 'android.keystore',
              'alias': 'yogures-alba'
          }
          data['enableNotifications'] = True
          with open('twa-manifest.json', 'w') as f:
              json.dump(data, f, indent=2)
          "
          cat twa-manifest.json

      - name: Build APK with Bubblewrap
        env:
          CI: "true"
          BUBBLEWRAP_KEYSTORE_PASSWORD: yogures123456
          BUBBLEWRAP_KEY_PASSWORD: yogures123456
        run: |
          yes "" | bubblewrap build --skipPwaValidation || true

      - name: Fallback Gradle Compilation (if needed)
        run: |
          if ! find . -name "*.apk" | grep -q "apk"; then
            echo "Looking for gradle project generated by bubblewrap..."
            if [ -f "gradlew" ]; then
              chmod +x gradlew
              ./gradlew assembleRelease || ./gradlew assembleDebug || true
            elif [ -d "app" ]; then
              find . -name "gradlew" -exec chmod +x {} \;
              find . -name "gradlew" -exec {} assembleRelease \; || true
            fi
          fi

      - name: Locate and Rename APK
        run: |
          echo "=== Files in workspace ==="
          find . -name "*.apk" -type f
          
          APK_FILE=$(find . -name "*signed*.apk" -o -name "*release*.apk" -o -name "*.apk" | head -1)
          
          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            echo "Found APK: $APK_FILE"
            cp "$APK_FILE" yogures-alba.apk
            echo "APK_READY=true" >> $GITHUB_ENV
            ls -lh yogures-alba.apk
          else
            echo "ERROR: No APK generated"
            echo "APK_READY=false" >> $GITHUB_ENV
          fi

      - name: Upload APK Artifact
        if: env.APK_READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: yogures-alba-apk
          path: yogures-alba.apk
          retention-days: 90

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            twa-manifest.json
            android.keystore
          retention-days: 7
